name: Web export

on: push

permissions:
  contents: read

jobs:
  web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Export Web build
        run: |
          mkdir -p dist/web
          godot --headless --export-release Web dist/web/index.html

      - name: Run game checks
        run: |
          godot --headless --script res://tests/checkpoints.gd
          godot --headless --script res://tests/levels.gd
          godot --headless --script res://tests/camera_facing.gd

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/web/
          if-no-files-found: error

      - name: Deploy to itch.io
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl --fail --location https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" push dist/web martindzejky/while-the-lantern-burns:web --userversion "$GITHUB_REF_NAME"
